<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }

  :root {
    --bg: #ffffff;
    --bar: #f1f3f4;
    --text: #202124;
    --text-dim: #5f6368;
    --border: #dadce0;
    --accent: #1a73e8;
    --hover: #e8eaed;
  }
  body.dark {
    --bg: #202124;
    --bar: #292a2d;
    --text: #e8eaed;
    --text-dim: #9aa0a6;
    --border: #3c4043;
    --accent: #8ab4f8;
    --hover: #3c4043;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    font-size: 12px;
    -webkit-user-select: none;
    user-select: none;
    color: var(--text);
  }

  #toolbar {
    height: 42px;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 8px;
    background: var(--bar);
    border-bottom: 1px solid var(--border);
    -webkit-app-region: drag;
    box-sizing: border-box;
  }

  #toolbar button,
  #toolbar input,
  #tabstrip,
  #bookmarksBar {
    -webkit-app-region: no-drag;
  }

  #logo {
    width: 15px; height: 15px; flex-shrink: 0; border-radius: 50%;
    border: 2px solid var(--accent); border-bottom-color: transparent;
    transform: rotate(-45deg); margin: 0 2px 0 4px;
  }

  /* ---- tab strip ---- */
  #tabstrip {
    display: flex;
    align-items: center;
    gap: 4px;
    max-width: 42%;
    overflow-x: auto;
    height: 30px;
    scrollbar-width: none;
  }
  #tabstrip::-webkit-scrollbar { display: none; }

  .tab {
    display: flex;
    align-items: center;
    gap: 6px;
    height: 26px;
    padding: 0 8px;
    border-radius: 6px;
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    flex-shrink: 0;
    max-width: 140px;
    min-width: 60px;
    border: 1px solid transparent;
  }
  .tab:hover { background: var(--hover); }
  .tab.active {
    background: var(--bg);
    color: var(--text);
    border-color: var(--border);
    box-shadow: 0 1px 2px rgba(0,0,0,0.06);
  }
  .tab.pinned {
    min-width: 30px;
    max-width: 30px;
    padding: 0;
    justify-content: center;
  }
  .tab .tab-monogram {
    width: 16px; height: 16px; border-radius: 4px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 600; color: #fff;
  }
  .tab .tab-title {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
    pointer-events: none;
  }
  .tab .tab-close {
    width: 14px;
    height: 14px;
    line-height: 14px;
    text-align: center;
    border-radius: 3px;
    color: inherit;
    opacity: 0.6;
    flex-shrink: 0;
  }
  .tab .tab-close:hover { opacity: 1; background: rgba(0,0,0,0.08); }

  #newTabBtn {
    width: 24px; height: 24px; flex-shrink: 0; border: none; border-radius: 5px;
    background: transparent; color: var(--text-dim); cursor: pointer; font-size: 15px; line-height: 1;
  }
  #newTabBtn:hover { background: var(--hover); }

  .divider { width: 1px; height: 20px; background: var(--border); flex-shrink: 0; }

  #navbtns { display: flex; align-items: center; gap: 2px; flex-shrink: 0; }
  #navbtns button, #starBtn, #menuBtn {
    width: 26px; height: 26px; border: none; border-radius: 5px; background: transparent;
    color: var(--text-dim); cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  #navbtns button:hover:not(:disabled), #starBtn:hover, #menuBtn:hover { background: var(--hover); }
  #navbtns button:disabled { opacity: 0.3; cursor: default; }
  #starBtn.active { color: var(--accent); }

  #urlbar {
    flex: 1; min-width: 0; height: 28px; padding: 0 10px; border: 1px solid var(--border);
    border-radius: 14px; background: var(--bg); color: var(--text); outline: none; font-size: 12px;
  }
  #urlbar:focus { border-color: var(--accent); }

  /* ---- window controls ---- */
  #winctrls { display: flex; align-items: center; gap: 0; flex-shrink: 0; }
  #winctrls button {
    width: 32px; height: 32px; border: none; background: transparent; color: var(--text-dim);
    cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center;
  }
  #winctrls button:hover { background: var(--hover); }
  #closeWinBtn:hover { background: #e81123; color: #fff; }

  /* ---- bookmarks bar ---- */
  #bookmarksBar {
    height: 32px;
    display: none;
    align-items: center;
    gap: 4px;
    padding: 0 10px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    -webkit-app-region: drag;
  }
  #bookmarksBar.show { display: flex; }
  #bookmarksBar::-webkit-scrollbar { display: none; }
  .bm-chip {
    display: flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 4px;
    font-size: 11px; color: var(--text); cursor: pointer; white-space: nowrap; flex-shrink: 0;
  }
  .bm-chip:hover { background: var(--hover); }
  .bm-empty { font-size: 11px; color: var(--text-dim); padding: 0 4px; }

  /* ---- floating menus ---- */
  .floating-menu {
    position: fixed;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.18);
    min-width: 190px;
    z-index: 9999;
    display: none;
    padding: 6px 0;
  }
  .floating-menu.show { display: block; }
  .menu-item {
    padding: 9px 14px; font-size: 12px; color: var(--text); cursor: pointer;
    display: flex; align-items: center; justify-content: space-between;
  }
  .menu-item:hover { background: var(--hover); }
  .menu-item.danger { color: #d93025; }
  .menu-divider { height: 1px; background: var(--border); margin: 4px 0; }
</style>
</head>
<body>
  <div id="toolbar">
    <div id="logo" title="Daybreak"></div>
    <div id="tabstrip"></div>
    <button id="newTabBtn" title="New tab">+</button>
    <div class="divider"></div>
    <div id="navbtns">
      <button id="backBtn" title="Back">&#8592;</button>
      <button id="fwdBtn" title="Forward">&#8594;</button>
      <button id="reloadBtn" title="Reload">&#8635;</button>
    </div>
    <input id="urlbar" type="text" spellcheck="false" placeholder="Search or enter address">
    <button id="starBtn" title="Bookmark this page">&#9733;</button>
    <button id="menuBtn" title="Menu">&#8942;</button>
    <div class="divider"></div>
    <div id="winctrls">
      <button id="minBtn" title="Minimize">&#8212;</button>
      <button id="maxBtn" title="Maximize">&#9723;</button>
      <button id="closeWinBtn" title="Close">&#10005;</button>
    </div>
  </div>

  <div id="bookmarksBar"></div>

  <div id="menuDropdown" class="floating-menu">
    <div class="menu-item" id="menuNewTab">New tab<span>Ctrl+T</span></div>
    <div class="menu-divider"></div>
    <div class="menu-item" id="menuBookmarks">Bookmarks</div>
    <div class="menu-item" id="menuHistory">History</div>
    <div class="menu-item" id="menuDownloads">Downloads</div>
    <div class="menu-item" id="menuSettings">Settings</div>
    <div class="menu-divider"></div>
    <div class="menu-item" id="menuToggleBar">Show bookmarks bar<span id="menuBarCheck"></span></div>
    <div class="menu-divider"></div>
    <div class="menu-item" id="menuAbout">About Daybreak</div>
  </div>

  <div id="tabContextMenu" class="floating-menu">
    <div class="menu-item" id="ctxDuplicate">Duplicate tab</div>
    <div class="menu-item" id="ctxPin">Pin tab</div>
    <div class="menu-divider"></div>
    <div class="menu-item" id="ctxCloseOthers">Close other tabs</div>
    <div class="menu-item danger" id="ctxClose">Close tab<span>Ctrl+W</span></div>
  </div>

<script>
(function () {
  var state = { activeId: null, tabs: [], settings: {} };
  var editingUrl = false;
  var contextTabId = null;

  var tabstrip = document.getElementById('tabstrip');
  var urlbar = document.getElementById('urlbar');
  var backBtn = document.getElementById('backBtn');
  var fwdBtn = document.getElementById('fwdBtn');
  var reloadBtn = document.getElementById('reloadBtn');
  var newTabBtn = document.getElementById('newTabBtn');
  var starBtn = document.getElementById('starBtn');
  var menuBtn = document.getElementById('menuBtn');
  var menuDropdown = document.getElementById('menuDropdown');
  var tabContextMenu = document.getElementById('tabContextMenu');
  var bookmarksBar = document.getElementById('bookmarksBar');
  var minBtn = document.getElementById('minBtn');
  var maxBtn = document.getElementById('maxBtn');
  var closeWinBtn = document.getElementById('closeWinBtn');

  function activeTab() {
    return state.tabs.find(function (t) { return t.id === state.activeId; }) || null;
  }

  function hueFor(str) {
    var h = 0;
    for (var i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) % 360;
    return h;
  }
  function hostOf(url) {
    try { return new URL(url).hostname.replace(/^www\./, ''); } catch (e) { return url || ''; }
  }

  function orderedTabs() {
    var pinned = state.tabs.filter(function (t) { return t.pinned; });
    var rest = state.tabs.filter(function (t) { return !t.pinned; });
    return pinned.concat(rest);
  }

  function renderTabs() {
    tabstrip.innerHTML = '';
    orderedTabs().forEach(function (tab) {
      var el = document.createElement('div');
      el.className = 'tab' + (tab.id === state.activeId ? ' active' : '') + (tab.pinned ? ' pinned' : '');
      el.title = tab.url;

      if (tab.pinned) {
        var host = hostOf(tab.url);
        var mono = document.createElement('span');
        mono.className = 'tab-monogram';
        mono.style.background = 'hsl(' + hueFor(host) + ',55%,45%)';
        mono.textContent = (host[0] || '?').toUpperCase();
        el.appendChild(mono);
      } else {
        var titleEl = document.createElement('span');
        titleEl.className = 'tab-title';
        titleEl.textContent = tab.loading ? 'Loading…' : (tab.title || 'New Tab');
        el.appendChild(titleEl);

        var closeEl = document.createElement('span');
        closeEl.className = 'tab-close';
        closeEl.textContent = '\u00d7';
        closeEl.addEventListener('click', function (e) {
          e.stopPropagation();
          window.api.closeTab(tab.id);
        });
        el.appendChild(closeEl);
      }

      el.addEventListener('click', function () { window.api.switchTab(tab.id); });
      el.addEventListener('contextmenu', function (e) {
        e.preventDefault();
        openTabContextMenu(tab, e.clientX, e.clientY);
      });
      tabstrip.appendChild(el);
    });
  }

  function renderToolbarState() {
    var active = activeTab();
    if (active) {
      if (!editingUrl) urlbar.value = active.url === 'daybreak://newtab' ? '' : active.url;
      backBtn.disabled = !active.canGoBack;
      fwdBtn.disabled = !active.canGoForward;
      starBtn.classList.toggle('active', !!active.bookmarked);
    } else {
      if (!editingUrl) urlbar.value = '';
      backBtn.disabled = true;
      fwdBtn.disabled = true;
      starBtn.classList.remove('active');
    }
  }

  function renderBookmarksBarVisibility() {
    var show = !!(state.settings && state.settings.showBookmarksBar);
    bookmarksBar.classList.toggle('show', show);
    document.getElementById('menuBarCheck').textContent = show ? '\u2713' : '';
    document.body.style.height = (42 + (show ? 32 : 0)) + 'px';
  }

  function refreshBookmarksBar() {
    window.api.getBookmarks().then(function (list) {
      bookmarksBar.innerHTML = '';
      if (!list.length) {
        var empty = document.createElement('span');
        empty.className = 'bm-empty';
        empty.textContent = 'Bookmarks you save will appear here';
        bookmarksBar.appendChild(empty);
        return;
      }
      list.forEach(function (b) {
        var chip = document.createElement('div');
        chip.className = 'bm-chip';
        chip.textContent = b.title || b.url;
        chip.title = b.url;
        chip.addEventListener('click', function () {
          if (state.activeId) window.api.navigate(state.activeId, b.url);
        });
        bookmarksBar.appendChild(chip);
      });
    });
  }

  function applyTheme() {
    document.body.classList.toggle('dark', !!(state.settings && state.settings.theme === 'dark'));
  }

  function render() {
    applyTheme();
    renderTabs();
    renderToolbarState();
    renderBookmarksBarVisibility();
    refreshBookmarksBar();
  }

  window.api.onUpdate(function (newState) {
    state = newState;
    render();
  });

  window.api.onWinState(function (winState) {
    maxBtn.innerHTML = winState.maximized ? '&#10064;' : '&#9723;';
    maxBtn.title = winState.maximized ? 'Restore' : 'Maximize';
  });

  window.api.onFocusUrlbar(function () {
    urlbar.focus();
    urlbar.select();
  });

  // ---- tab actions ----
  newTabBtn.addEventListener('click', function () { window.api.createTab(); });
  backBtn.addEventListener('click', function () { if (state.activeId) window.api.goBack(state.activeId); });
  fwdBtn.addEventListener('click', function () { if (state.activeId) window.api.goForward(state.activeId); });
  reloadBtn.addEventListener('click', function () { if (state.activeId) window.api.reload(state.activeId); });

  starBtn.addEventListener('click', function () {
    var active = activeTab();
    if (!active) return;
    if (active.bookmarked) window.api.removeBookmarkByUrl(active.url);
    else window.api.addBookmark(active.url, active.title);
  });

  urlbar.addEventListener('focus', function () { editingUrl = true; });
  urlbar.addEventListener('blur', function () { editingUrl = false; renderToolbarState(); });
  urlbar.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      if (state.activeId) window.api.navigate(state.activeId, urlbar.value);
      urlbar.blur();
    } else if (e.key === 'Escape') {
      urlbar.blur();
    }
  });

  // ---- window controls ----
  minBtn.addEventListener('click', function () { window.api.minimizeWindow(); });
  maxBtn.addEventListener('click', function () { window.api.maximizeWindow(); });
  closeWinBtn.addEventListener('click', function () { window.api.closeWindow(); });

  // ---- floating menu helpers (main dropdown + tab context menu share one slot) ----
  function closeAllMenus() {
    menuDropdown.classList.remove('show');
    tabContextMenu.classList.remove('show');
    window.api.setOverlayExtra(0);
  }

  function openMenu() {
    closeAllMenus();
    var rect = menuBtn.getBoundingClientRect();
    menuDropdown.style.top = (rect.bottom + 4) + 'px';
    menuDropdown.style.right = '8px';
    menuDropdown.style.left = '';
    menuDropdown.classList.add('show');
    window.api.setOverlayExtra(320);
  }

  function openTabContextMenu(tab, x, y) {
    closeAllMenus();
    contextTabId = tab.id;
    document.getElementById('ctxPin').textContent = tab.pinned ? 'Unpin tab' : 'Pin tab';
    tabContextMenu.style.top = (y + 2) + 'px';
    tabContextMenu.style.left = x + 'px';
    tabContextMenu.style.right = '';
    tabContextMenu.classList.add('show');
    window.api.setOverlayExtra(220);
  }

  menuBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    if (menuDropdown.classList.contains('show')) closeAllMenus(); else openMenu();
  });
  document.addEventListener('click', function (e) {
    if (!e.target.closest('.floating-menu') && !e.target.closest('#menuBtn')) closeAllMenus();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeAllMenus();
  });

  // ---- main menu items ----
  document.getElementById('menuNewTab').addEventListener('click', function () {
    window.api.createTab(); closeAllMenus();
  });
  document.getElementById('menuBookmarks').addEventListener('click', function () {
    if (state.activeId) window.api.navigate(state.activeId, 'daybreak://bookmarks'); closeAllMenus();
  });
  document.getElementById('menuHistory').addEventListener('click', function () {
    if (state.activeId) window.api.navigate(state.activeId, 'daybreak://history'); closeAllMenus();
  });
  document.getElementById('menuDownloads').addEventListener('click', function () {
    if (state.activeId) window.api.navigate(state.activeId, 'daybreak://downloads'); closeAllMenus();
  });
  document.getElementById('menuSettings').addEventListener('click', function () {
    if (state.activeId) window.api.navigate(state.activeId, 'daybreak://settings'); closeAllMenus();
  });
  document.getElementById('menuAbout').addEventListener('click', function () {
    if (state.activeId) window.api.navigate(state.activeId, 'daybreak://about'); closeAllMenus();
  });
  document.getElementById('menuToggleBar').addEventListener('click', function () {
    var current = !!(state.settings && state.settings.showBookmarksBar);
    window.api.setSettings({ showBookmarksBar: !current });
    closeAllMenus();
  });

  // ---- tab context menu items ----
  document.getElementById('ctxDuplicate').addEventListener('click', function () {
    if (contextTabId) window.api.duplicateTab(contextTabId); closeAllMenus();
  });
  document.getElementById('ctxPin').addEventListener('click', function () {
    if (contextTabId) window.api.togglePinTab(contextTabId); closeAllMenus();
  });
  document.getElementById('ctxCloseOthers').addEventListener('click', function () {
    if (contextTabId) window.api.closeOtherTabs(contextTabId); closeAllMenus();
  });
  document.getElementById('ctxClose').addEventListener('click', function () {
    if (contextTabId) window.api.closeTab(contextTabId); closeAllMenus();
  });
})();
</script>
</body>
</html>
